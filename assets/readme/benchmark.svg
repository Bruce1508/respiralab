<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">RespiraLab verified results</title><desc id="desc">Validation macro-F1 comparison for logistic regression, RBF SVM and compact CNN, plus verified dataset and system statistics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d12"/><stop offset="1" stop-color="#15111a"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.eye{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:5px;fill:#8b8398}.head{font:700 38px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f0e8}.model{font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e9e2dc}.value{font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f0e8}.small{font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#918a99}.stat{font:800 36px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f0e8}.caption{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#aaa1af}</style>
  </defs>
  <rect width="1400" height="700" rx="34" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="698" rx="33" fill="none" stroke="#30283a" stroke-width="2"/>
  <text class="eye" x="70" y="72">SAME SPLIT · SAME TASK · HONEST RESULT</text><text class="head" x="70" y="122">The fanciest model did not win.</text><text class="small" x="70" y="158">Validation macro-F1 · 21 patients · 1,108 respiratory cycles</text>
  <text class="model" x="70" y="230">E01 · LOGISTIC REGRESSION</text><rect x="390" y="207" width="750" height="28" rx="14" fill="#29252d"/><rect x="390" y="207" width="567" height="28" rx="14" fill="url(#bar)" filter="url(#glow)"/><text class="value" x="1170" y="229">0.3782</text><text class="small" x="1270" y="229">FROZEN</text>
  <text class="model" x="70" y="306">E02 · RBF SVM</text><rect x="390" y="283" width="750" height="28" rx="14" fill="#29252d"/><rect x="390" y="283" width="581" height="28" rx="14" fill="url(#bar)"/><text class="value" x="1170" y="305">0.3872</text><text class="small" x="1270" y="305">REFERENCE</text>
  <text class="model" x="70" y="382">E03 · COMPACT CNN</text><rect x="390" y="359" width="750" height="28" rx="14" fill="#29252d"/><rect x="390" y="359" width="474" height="28" rx="14" fill="url(#bar)"/><text class="value" x="1170" y="381">0.3157</text><text class="small" x="1270" y="381">REJECTED</text>
  <line x1="70" y1="437" x2="1330" y2="437" stroke="#302a36"/>
  <g transform="translate(70 480)"><rect width="230" height="145" rx="20" fill="#141219" stroke="#2e2937"/><text class="stat" x="25" y="60">6,898</text><text class="caption" x="25" y="96">REAL CYCLES</text><text class="small" x="25" y="121">920 recordings</text></g>
  <g transform="translate(330 480)"><rect width="230" height="145" rx="20" fill="#141219" stroke="#2e2937"/><text class="stat" x="25" y="60">0</text><text class="caption" x="25" y="96">PATIENT OVERLAP</text><text class="small" x="25" y="121">primary protocol</text></g>
  <g transform="translate(590 480)"><rect width="230" height="145" rx="20" fill="#141219" stroke="#2e2937"/><text class="stat" x="25" y="60">170</text><text class="caption" x="25" y="96">TESTS PASSING</text><text class="small" x="25" y="121">synthetic E2E included</text></g>
  <g transform="translate(850 480)"><rect width="230" height="145" rx="20" fill="#141219" stroke="#2e2937"/><text class="stat" x="25" y="60">3.54 ms</text><text class="caption" x="25" y="96">P95 INFERENCE</text><text class="small" x="25" y="121">macOS arm64 · CPU</text></g>
  <g transform="translate(1110 480)"><rect width="220" height="145" rx="20" fill="#141219" stroke="#2e2937"/><text class="stat" x="25" y="60">27.7 s</text><text class="caption" x="25" y="96">FULL FEATURES</text><text class="small" x="25" y="121">all 6,898 cycles</text></g>
</svg>
