<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">RespiraLab v2 vs v1 — three honest comparisons</title><desc id="desc">Macro-F1 comparison between v1 (E01 logistic regression) and v2 (E06 pretrained AST fine-tune) across grouped cross-validation, the primary test, and zero-shot external validation, plus v2 serving stats.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d12"/><stop offset="1" stop-color="#0e1216"/></linearGradient>
    <style>
      .eye{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;fill:#8b8398}
      .head{font:700 34px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f0e8}
      .proto{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cdc7d3}
      .value{font:700 19px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f0e8}
      .small{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8e889a}
      .stat{font:800 28px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f0e8}
      .caption{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px;fill:#a79fb0}
      .legend{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cdc7d3}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg2)"/><rect x="1" y="1" width="1398" height="758" rx="27" fill="none" stroke="#262230" stroke-width="2"/>

  <text class="eye" x="64" y="68">V1 VS V2 · SAME TASK · STRICTER EVIDENCE</text>
  <text class="head" x="64" y="112">Pretrained audio wins, three different ways.</text>
  <text class="small" x="64" y="144">Macro-F1 — each protocol run exactly once per model, never re-tuned after the fact</text>

  <rect x="1130" y="54" width="14" height="14" rx="3" fill="#918a99"/><text class="legend" x="1152" y="66">v1 · E01</text>
  <rect x="1130" y="80" width="14" height="14" rx="3" fill="#34d399"/><text class="legend" x="1152" y="92">v2 · E06 AST</text>

  <!-- Grouped CV -->
  <text class="proto" x="64" y="208">GROUPED CV · 5-FOLD</text>
  <rect x="440" y="186" width="710" height="22" rx="11" fill="#1b1922"/><rect x="440" y="186" width="259" height="22" rx="11" fill="#918a99"/>
  <text class="value" x="1162" y="202">0.3654</text>
  <rect x="440" y="216" width="710" height="22" rx="11" fill="#1b1922"/><rect x="440" y="216" width="340" height="22" rx="11" fill="#34d399"/>
  <text class="value" x="1162" y="232">0.4791</text>

  <!-- Primary test -->
  <text class="proto" x="64" y="298">PRIMARY TEST · ONE-TIME</text>
  <rect x="440" y="276" width="710" height="22" rx="11" fill="#1b1922"/><rect x="440" y="276" width="203" height="22" rx="11" fill="#918a99"/>
  <text class="value" x="1162" y="292">0.2861</text>
  <rect x="440" y="306" width="710" height="22" rx="11" fill="#1b1922"/><rect x="440" y="306" width="369" height="22" rx="11" fill="#34d399"/>
  <text class="value" x="1162" y="322">0.5208</text>

  <!-- External -->
  <text class="proto" x="64" y="388">EXTERNAL ZERO-SHOT · HF_LUNG_V1</text>
  <rect x="440" y="366" width="710" height="22" rx="11" fill="#1b1922"/><rect x="440" y="366" width="154" height="22" rx="11" fill="#918a99"/>
  <text class="value" x="1162" y="382">0.2165</text>
  <rect x="440" y="396" width="710" height="22" rx="11" fill="#1b1922"/><rect x="440" y="396" width="214" height="22" rx="11" fill="#34d399"/>
  <text class="value" x="1162" y="412">0.3025</text>

  <line x1="64" y1="458" x2="1336" y2="458" stroke="#262230"/>
  <text class="eye" x="64" y="496">V2 SERVING · D56</text>

  <g transform="translate(64 520)"><rect width="305" height="150" rx="16" fill="#131119" stroke="#262230"/>
    <text class="caption" x="24" y="38">HASH-VERIFIED WEIGHTS</text>
    <text class="stat" x="24" y="80">sha256</text>
    <text class="small" x="24" y="118">Hugging Face Hub,</text>
    <text class="small" x="24" y="136">refused on mismatch</text>
  </g>
  <g transform="translate(389 520)"><rect width="305" height="150" rx="16" fill="#131119" stroke="#262230"/>
    <text class="caption" x="24" y="38">OOD GATE THRESHOLD</text>
    <text class="stat" x="24" y="80">42.14</text>
    <text class="small" x="24" y="118">Mahalanobis,</text>
    <text class="small" x="24" y="136">fit on train only</text>
  </g>
  <g transform="translate(714 520)"><rect width="305" height="150" rx="16" fill="#131119" stroke="#262230"/>
    <text class="caption" x="24" y="38">TESTS PASSING</text>
    <text class="stat" x="24" y="80">247</text>
    <text class="small" x="24" y="118">fresh clone,</text>
    <text class="small" x="24" y="136">zero real data needed</text>
  </g>
  <g transform="translate(1039 520)"><rect width="297" height="150" rx="16" fill="#131119" stroke="#262230"/>
    <text class="caption" x="24" y="38">v2 ROADMAP DONE</text>
    <text class="stat" x="24" y="80">D43–D57</text>
    <text class="small" x="24" y="118">gates G7 and G8</text>
    <text class="small" x="24" y="136">both passed</text>
  </g>

  <text class="small" x="64" y="718">Honest, not perfect: v2's calibration worsens on test, and external crackle recall is only 0.055 — both disclosed, not hidden.</text>
</svg>
