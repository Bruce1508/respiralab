<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">RespiraLab signal pipeline</title>
  <desc id="desc">Respiratory audio moves through validation, patient-disjoint splitting, DSP, model comparison, evaluation, and a research demo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#0e1216"/></linearGradient>
    <style>
      .eyebrow{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;fill:#8b8398}
      .heading{font:700 34px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f0e8}
      .label{font:700 19px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f5f0e8}
      .sub{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8e889a}
      .num{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0b0d12}
    </style>
  </defs>
  <rect width="1400" height="680" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="678" rx="27" fill="none" stroke="#262230" stroke-width="2"/>
  <text class="eyebrow" x="64" y="68">THE SIGNAL PATH</text>
  <text class="heading" x="64" y="112">One breath. Seven accountable steps.</text>

  <path d="M106 302H1294" stroke="#262230" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(70 210)"><rect width="156" height="184" rx="18" fill="#131119" stroke="#262230"/><circle cx="30" cy="92" r="16" fill="#67e8f9"/><text class="num" x="25" y="98">1</text><text class="label" x="24" y="42">INGEST</text><text class="sub" x="24" y="133">WAV + expert</text><text class="sub" x="24" y="156">annotations</text></g>
  <g transform="translate(254 210)"><rect width="156" height="184" rx="18" fill="#131119" stroke="#262230"/><circle cx="30" cy="92" r="16" fill="#67e8f9"/><text class="num" x="25" y="98">2</text><text class="label" x="24" y="42">VALIDATE</text><text class="sub" x="24" y="133">audio, bounds,</text><text class="sub" x="24" y="156">provenance</text></g>
  <g transform="translate(438 210)"><rect width="156" height="184" rx="18" fill="#131119" stroke="#262230"/><circle cx="30" cy="92" r="16" fill="#67e8f9"/><text class="num" x="25" y="98">3</text><text class="label" x="24" y="42">SPLIT</text><text class="sub" x="24" y="133">patient-disjoint</text><text class="sub" x="24" y="156">84 / 21 / 21</text></g>
  <g transform="translate(622 210)"><rect width="156" height="184" rx="18" fill="#131119" stroke="#262230"/><circle cx="30" cy="92" r="16" fill="#67e8f9"/><text class="num" x="25" y="98">4</text><text class="label" x="24" y="42">DSP</text><text class="sub" x="24" y="133">crop · resample</text><text class="sub" x="24" y="156">features · Mel</text></g>
  <g transform="translate(806 210)"><rect width="156" height="184" rx="18" fill="#131119" stroke="#262230"/><circle cx="30" cy="92" r="16" fill="#67e8f9"/><text class="num" x="25" y="98">5</text><text class="label" x="24" y="42">MODEL</text><text class="sub" x="24" y="133">classical ML vs</text><text class="sub" x="24" y="156">compact CNN</text></g>
  <g transform="translate(990 210)"><rect width="156" height="184" rx="18" fill="#131119" stroke="#262230"/><circle cx="30" cy="92" r="16" fill="#67e8f9"/><text class="num" x="25" y="98">6</text><text class="label" x="24" y="42">EVALUATE</text><text class="sub" x="24" y="133">macro-F1 · CI</text><text class="sub" x="24" y="156">failure analysis</text></g>
  <g transform="translate(1174 210)"><rect width="156" height="184" rx="18" fill="#131119" stroke="#262230"/><circle cx="30" cy="92" r="16" fill="#67e8f9"/><text class="num" x="25" y="98">7</text><text class="label" x="24" y="42">EXPLAIN</text><text class="sub" x="24" y="133">probabilities +</text><text class="sub" x="24" y="156">provenance</text></g>

  <rect x="64" y="484" width="1272" height="116" rx="18" fill="#131119" stroke="#262230"/>
  <circle cx="102" cy="526" r="6" fill="#34d399"/>
  <text class="eyebrow" x="124" y="533" fill="#34d399">NON-NEGOTIABLE</text>
  <text class="label" x="97" y="574">No patient leakage · no test-set tuning · no diagnosis claims</text>
</svg>
