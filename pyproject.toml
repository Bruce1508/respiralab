[project]
name = "respiralab"
version = "0.1.0"
description = "Reproducible respiratory-cycle sound classifier (Normal/Crackle/Wheeze/Both) on ICBHI 2017 — research/educational tool, not a diagnostic device."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "streamlit>=1.32",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0.3",
]

[project.scripts]
respiralab = "respiralab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/respiralab"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
