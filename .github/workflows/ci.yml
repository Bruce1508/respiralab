name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Package import smoke
        run: uv run python -c "import respiralab; print(respiralab.__version__)"
      - name: CLI smoke
        run: uv run respiralab --version
      - name: Tests (synthetic-only; real ICBHI data is gitignored and absent here)
        run: uv run pytest -q
